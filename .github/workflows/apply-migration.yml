name: Apply Migration

# One-shot escape hatch for when the Supabase MCP connector is unavailable/unauthorized in a session.
# Hits the Supabase Management API's SQL endpoint directly with the existing SUPERBASE_ACCESS_TOKEN org
# secret (same token deploy-supabase-functions.yml already uses) — no new secret, no DB password needed.
# Each `sql` input is run as ONE statement/transaction (its own curl call), so a caller applying an
# ALTER TYPE ... ADD VALUE followed by a statement that USES the new value must dispatch this workflow
# twice (the new enum value can't be referenced in the same transaction it was added in).

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL to run against the live project (one statement/transaction)'
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    name: Apply SQL via Supabase Management API
    steps:
      - name: Run SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPERBASE_ACCESS_TOKEN }}
          SQL: ${{ github.event.inputs.sql }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPERBASE_ACCESS_TOKEN not set as a GitHub secret" >&2
            exit 1
          fi
          BODY=$(jq -n --arg q "$SQL" '{query: $q}')
          RESP=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/wwxgajrtmslzklnyplah/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          OUT=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Migration query failed" >&2
            exit 1
          fi
