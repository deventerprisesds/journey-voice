name: Debug Alarm Trace

on:
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'How many hours back to search (default 2)'
        required: false
        default: '2'

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Compute cutoff timestamp
        id: cutoff
        run: |
          HOURS="${{ github.event.inputs.hours_back }}"
          HOURS=${HOURS:-2}
          CUTOFF=$(python3 -c "import datetime; print((datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=float('$HOURS'))).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          echo "cutoff=$CUTOFF" >> $GITHUB_OUTPUT
          echo "Searching last ${HOURS}h — cutoff: $CUTOFF"

      - name: Fetch alarm_notification_dispatched entries
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          CUTOFF="${{ steps.cutoff.outputs.cutoff }}"
          echo "=== SERVER: alarm_notification_dispatched (notification-delivery) ==="
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=created_at,metadata" \
            --data-urlencode "activity_type=eq.alarm_notification_dispatched" \
            --data-urlencode "created_at=gte.${CUTOFF}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=20" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")
          HTTP=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then echo "ERROR: Supabase returned HTTP $HTTP — $BODY"; else
          echo "$BODY" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list): print(f'Unexpected: {data}'); sys.exit(0)
          print(f'{len(data)} row(s) found')
          for r in data:
              m = r.get('metadata', {})
              if isinstance(m, str): m = json.loads(m)
              print(f'  [{r[\"created_at\"][:19]}] type={m.get(\"primaryType\",\"?\")} chan={m.get(\"androidChannel\",\"?\")} fcmTag={m.get(\"fcmTag\",\"?\")} taskId={str(m.get(\"taskId\",\"-\"))[:8]} batch={m.get(\"batchSize\",\"?\")} title={str(m.get(\"title\",\"-\"))[:40]}')
          "; fi

      - name: Fetch fcm_send_success entries
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          CUTOFF="${{ steps.cutoff.outputs.cutoff }}"
          echo ""
          echo "=== SERVER: fcm_send_success (send-push-notification) ==="
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=created_at,metadata" \
            --data-urlencode "activity_type=eq.fcm_send_success" \
            --data-urlencode "created_at=gte.${CUTOFF}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=20" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")
          HTTP=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then echo "ERROR: Supabase returned HTTP $HTTP — $BODY"; else
          echo "$BODY" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list): print(f'Unexpected: {data}'); sys.exit(0)
          print(f'{len(data)} row(s) found')
          for r in data:
              m = r.get('metadata', {})
              if isinstance(m, str): m = json.loads(m)
              print(f'  [{r[\"created_at\"][:19]}] chan={m.get(\"channel\",\"?\")} title={str(m.get(\"title\",\"-\"))[:40]} token={m.get(\"token_prefix\",\"?\")}')
          "; fi

      - name: Fetch fcm_send_failed entries
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          CUTOFF="${{ steps.cutoff.outputs.cutoff }}"
          echo ""
          echo "=== SERVER: fcm_send_failed (send-push-notification) ==="
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=created_at,metadata,error_message" \
            --data-urlencode "activity_type=eq.fcm_send_failed" \
            --data-urlencode "created_at=gte.${CUTOFF}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=10" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")
          HTTP=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then echo "ERROR: Supabase returned HTTP $HTTP — $BODY"; else
          echo "$BODY" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list): print(f'Unexpected: {data}'); sys.exit(0)
          if not data: print('  (none)')
          else:
              for r in data:
                  m = r.get('metadata', {})
                  if isinstance(m, str): m = json.loads(m)
                  print(f'  [{r[\"created_at\"][:19]}] chan={m.get(\"channel\",\"?\")} error={r.get(\"error_message\",\"?\")}')
          "; fi

      - name: Fetch android_alarm_trace entries (from device via Supabase)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          CUTOFF="${{ steps.cutoff.outputs.cutoff }}"
          echo ""
          echo "=== ANDROID: android_alarm_trace (device pushAlarmTrace) ==="
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=created_at,metadata" \
            --data-urlencode "activity_type=eq.android_alarm_trace" \
            --data-urlencode "created_at=gte.${CUTOFF}" \
            --data-urlencode "order=created_at.asc" \
            --data-urlencode "limit=50" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")
          HTTP=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "ERROR: Supabase returned HTTP $HTTP — $BODY"
            echo "HINT: If code 57014 (query timeout), run migration 20260721000000_add_activity_log_index.sql"
          else
          echo "$BODY" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list): print(f'Unexpected: {data}'); sys.exit(0)
          print(f'{len(data)} row(s) found')
          for r in data:
              m = r.get('metadata', {})
              if isinstance(m, str): m = json.loads(m)
              print(f'  [{r[\"created_at\"][11:19]}] {m.get(\"message\",\"?\")}')
          "; fi

      - name: Summary
        run: |
          echo ""
          echo "=== HOW TO READ THIS ==="
          echo "1. alarm_notification_dispatched → notification-delivery decided to send an alarm FCM"
          echo "   - androidChannel should be 'calendar_events'"
          echo "   - fcmTag will be 'fcm' (known bug: all alarms share this tag)"
          echo "2. fcm_send_success → send-push-notification sent FCM to device"
          echo "   - chan should be 'calendar_events'"
          echo "   - If this row is present but ALARM_CONFIRM_LAUNCHED is NOT in the Android /debug log,"
          echo "     the FCM was delivered but AlarmConfirmActivity never launched"
          echo ""
          echo "=== ANDROID SIDE ==="
          echo "Open Journey Voice app → Settings or /debug → Widget Debug Log"
          echo "Look for lines:"
          echo "  FCM_RX       — FCM received by BridgeFirebaseService"
          echo "  FCM_FIRE     — NotificationEngine.fire() return value"
          echo "  GATE              — calendar_events gate reached (confirmed=true/false)"
          echo "  GATE→FULLSCREEN   — gate posted fullScreenIntent (first fire, confirmed=false)"
          echo "  GATE→ALARM        — confirmed=true: overlay+sound dispatched"
          echo "  ALARM_OVERLAY_SHOWN — overlay window added successfully (canDrawOverlays=true)"
          echo "  ALARM_OVERLAY_FAIL  — overlay addView threw (check error message)"
          echo "  ALARM_REPEAT_FIRE   — AlarmRepeater.RepeatReceiver fired (re-fire)"
          echo "  ALARM_CONFIRM_LAUNCHED — AlarmConfirmActivity.onCreate() ran (lock-screen path)"
          echo "  ALARM_BTN         — user tapped Confirm/Snooze/Dismiss"
          echo ""
          echo "=== EXPECTED HAPPY PATH (Confirm tap → 5-min re-fire) ==="
          echo "FCM_RX chan=calendar_events"
          echo "FCM_FIRE fired=true"
          echo "GATE chan=calendar_events tag=fcm confirmed=false"
          echo "GATE→FULLSCREEN tag=fcm"
          echo "ALARM_OVERLAY_SHOWN tag=fcm  (or ALARM_CONFIRM_LAUNCHED if screen-off)"
          echo "ALARM_BTN action=...CONFIRM tag=fcm"
          echo "--- 5 minutes later ---"
          echo "ALARM_REPEAT_FIRE tag=fcm fireCount=0 chan=calendar_events"
          echo "GATE chan=calendar_events tag=fcm confirmed=true"
          echo "GATE→ALARM tag=fcm (confirmed was true, showing overlay+sound)"
          echo "ALARM_OVERLAY_SHOWN tag=fcm"
