name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./cloudflare
        run: npm install

      - name: Deploy to Cloudflare
        working-directory: ./cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Worker Secrets
        working-directory: ./cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CF_OPENAI_API_KEY }}" | npx wrangler secret put OPENAI_API_KEY
          echo "${{ secrets.CF_SUPABASE_SERVICE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_KEY

      # Secrets for the /notify endpoint. All FOUR already exist as org secrets — the Graph app
      # is the same service principal boost and huddle use, and JOURNEY_PROXY_TOKEN is the shared
      # journey<->huddle token. No new org secret is minted, per the standing rule.
      #
      # Each is skipped rather than blanked when absent: `wrangler secret put` with empty stdin
      # would STORE an empty string, and graphConfigured() would then read as configured and the
      # endpoint would fail at Graph instead of reporting not_configured. A skipped secret leaves
      # the honest "not_configured" answer intact.
      - name: Set notification secrets
        working-directory: ./cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOURNEY_PROXY_TOKEN: ${{ secrets.JOURNEY_PROXY_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          put() {
            if [ -z "$2" ]; then
              echo "::warning::$1 is empty — skipping. /notify will report not_configured for that capability."
            else
              printf '%s' "$2" | npx wrangler secret put "$1"
              echo "set $1"
            fi
          }
          put JOURNEY_PROXY_TOKEN "$JOURNEY_PROXY_TOKEN"
          put AZURE_CLIENT_ID     "$AZURE_CLIENT_ID"
          put AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
          put AZURE_TENANT_ID     "$AZURE_TENANT_ID"

      - name: Wait for deployment propagation
        run: sleep 15

      - name: Verify Health Endpoint and Version
        run: |
          HEALTH_RESPONSE=$(curl -s https://twilio-openai-bridge.purple-bush-495e.workers.dev/health)
          echo "Health response: $HEALTH_RESPONSE"
          
          # IMPORTANT: Update this when changing version in cloudflare/src/index.ts and TwilioCallSession.ts
          # See cloudflare/PREFLIGHT_CHECKLIST.md for version sync requirements
          EXPECTED_VERSION="2026-03-11-cf-v9"
          
          if echo "$HEALTH_RESPONSE" | grep -q '"status":"ok"'; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi
          
          if echo "$HEALTH_RESPONSE" | grep -q "\"version\":\"$EXPECTED_VERSION\""; then
            echo "✅ Version check passed: $EXPECTED_VERSION"
          else
            echo "❌ Version mismatch! Expected: $EXPECTED_VERSION"
            echo "   Got: $HEALTH_RESPONSE"
            exit 1
          fi

      - name: Verify WebSocket Endpoint Exists
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://twilio-openai-bridge.purple-bush-495e.workers.dev/call)
          echo "WebSocket endpoint status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "426" ]; then
            echo "✅ WebSocket endpoint correctly configured!"
          else
            echo "❌ WebSocket endpoint returned unexpected status: $HTTP_STATUS"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🚀 Cloudflare Worker Deployed Successfully"
          echo "=========================================="
          echo "Worker URL: https://twilio-openai-bridge.purple-bush-495e.workers.dev"
          echo "Health: https://twilio-openai-bridge.purple-bush-495e.workers.dev/health"
          echo "WebSocket: wss://twilio-openai-bridge.purple-bush-495e.workers.dev/call"
          echo "=========================================="
