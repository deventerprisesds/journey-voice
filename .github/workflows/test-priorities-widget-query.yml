name: Test Priorities Widget Queries

on:
  workflow_dispatch:

jobs:
  test-priorities-queries:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://wwxgajrtmslzklnyplah.supabase.co
      SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Run all three widget queries end-to-end
        run: |
          python3 scripts/widget-priorities-queries.py

      - name: Read widget debug log from error_log table
        run: |
          python3 scripts/widget-error-log-read.py
