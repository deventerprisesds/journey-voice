name: Debug Schedule Log

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to investigate (YYYY-MM-DD, local timezone). Leave blank for today.'
        required: false
        default: ''
      timezone_offset_hours:
        description: 'Device timezone UTC offset in hours (e.g. -4 for EDT, -7 for PDT)'
        required: false
        default: '-4'

jobs:
  debug-log:
    runs-on: ubuntu-latest
    steps:
      - name: Compute target date
        id: date
        run: |
          OFFSET="${{ github.event.inputs.timezone_offset_hours }}"
          OFFSET=${OFFSET:--4}
          INPUT_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$INPUT_DATE" ]; then
            TARGET=$(python3 -c "import datetime; offset=float('$OFFSET'); now=datetime.datetime.now(datetime.timezone.utc); local=(now+datetime.timedelta(hours=offset)).date(); print(local)")
          else
            TARGET="$INPUT_DATE"
          fi
          CUTOFF=$(python3 -c "import datetime; print((datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=48)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          echo "target_date=$TARGET" >> $GITHUB_OUTPUT
          echo "cutoff=$CUTOFF" >> $GITHUB_OUTPUT
          echo "Investigating nightly schedule run for: $TARGET (UTC offset ${OFFSET}h)"
          echo "Cutoff (48h): $CUTOFF"

      - name: Find most recent nightly_schedule_built row (id only)
        id: find
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          CUTOFF="${{ steps.date.outputs.cutoff }}"
          echo "=== FINDING recent activity_log rows (last 48h, no type filter) ==="
          echo "Will filter for nightly_schedule_built in Python after fetch"

          # No activity_type filter — that column has no index and causes full table scan.
          # Use tight 48h created_at window (indexed) + limit=50, filter type in Python.
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=id,created_at,status,activity_type" \
            --data-urlencode "created_at=gte.${CUTOFF}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=50" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")

          HTTP_CODE=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          RESULT=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: HTTP $HTTP_CODE"
            echo "Response: $RESULT"
            exit 1
          fi

          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(len(arr))" 2>/dev/null || echo "?")
          echo "Total rows returned (last 48h): $COUNT"

          ROW_ID=$(echo "$RESULT" | python3 -c "
          import json,sys
          arr=json.load(sys.stdin)
          for r in arr:
              if r.get('activity_type') == 'nightly_schedule_built':
                  print(r['id'])
                  break
          " 2>/dev/null || echo "")

          echo "$RESULT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print('All activity types in last 48h:')
          for row in data:
              marker = ' <<< TARGET' if row.get('activity_type') == 'nightly_schedule_built' else ''
              print(f\"  id={row['id'][:8]}  created={row['created_at'][:16]}  type={row.get('activity_type','?')}{marker}\")
          " || echo "Could not parse"

          echo "Found nightly_schedule_built row id: $ROW_ID"
          echo "row_id=$ROW_ID" >> $GITHUB_OUTPUT

      - name: Fetch metadata for that row by primary key
        id: fetch
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          ROW_ID="${{ steps.find.outputs.row_id }}"
          if [ -z "$ROW_ID" ]; then
            echo "No row ID found — no nightly_schedule_built entries in the last 7 days."
            exit 0
          fi
          echo "=== FETCHING metadata for row $ROW_ID ==="

          # Fetch metadata by primary key — fast single-row lookup
          FULL=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "select=created_at,status,metadata" \
            --data-urlencode "id=eq.${ROW_ID}" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/activity_log")

          HTTP_CODE=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          RESULT=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: HTTP $HTTP_CODE"
            echo "Response: $RESULT"
            exit 1
          fi

          # Write result to a temp file — avoids single-quote injection when passing JSON to Python
          echo "$RESULT" > /tmp/activity_log_result.json
          echo "Metadata fetched successfully ($(echo "$RESULT" | wc -c) bytes)"

      - name: Extract scoring and placement for target date
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TARGET_DATE="${{ steps.date.outputs.target_date }}"

          if [ ! -s /tmp/activity_log_result.json ] || [ "$(cat /tmp/activity_log_result.json)" = "[]" ]; then
            echo "No metadata available — either no row found or previous step skipped."
            exit 0
          fi

          echo ""
          echo "=== SCORING AUDIT + PLACEMENT STEPS for $TARGET_DATE ==="

          python3 -c "
          import json, sys

          target_date = '$TARGET_DATE'
          data = json.load(open('/tmp/activity_log_result.json'))
          if not data:
              print('No activity_log entries found.')
              sys.exit(0)

          row = data[0]
          meta = row.get('metadata', {})
          steps = meta.get('steps', [])

          print(f'Run timestamp: {row[\"created_at\"]}')
          print(f'Status: {row[\"status\"]}')
          print(f'Trigger: {meta.get(\"triggerSource\", \"?\")}')
          print(f'Total scheduled: {meta.get(\"total_scheduled\", \"?\")}')
          print(f'Days processed: {meta.get(\"days_processed\", \"?\")}')
          print(f'Rolled over: {meta.get(\"rolled_over\", \"?\")}')
          print()

          # Assignment tiers
          at = meta.get('assignment_tiers', {})
          if at:
              print('=== ASSIGNMENT TIERS ===')
              for k,v in at.items():
                  print(f'  {k}: {v}')
              print()

          # Calendar status
          cs = meta.get('calendar_status', {})
          if cs:
              print(f'=== CALENDAR STATUS: {cs.get(\"state\",\"?\")} | events_today={cs.get(\"events_today\",\"?\")} ===')
              print()

          # Week results
          wr = meta.get('week_results', {})
          if wr:
              print('=== WEEK RESULTS ===')
              for date, info in wr.items():
                  print(f'  {date}: scheduled={info.get(\"scheduled\",\"?\")} candidates={info.get(\"candidates\",\"?\")}')
                  if info.get('rejections'):
                      print(f'    rejections: {info[\"rejections\"]}')
              print()

          # Steps for the target date
          target_steps = [s for s in steps if target_date in s.get('step', '')]
          if not target_steps:
              all_step_names = [s.get('step','?') for s in steps]
              print(f'No steps found for date {target_date}')
              print(f'Available step names: {all_step_names}')
          else:
              for step in target_steps:
                  step_name = step.get('step', '?')
                  inputs = step.get('inputs', {})
                  outputs = step.get('outputs', {})
                  dur = step.get('durationMs', '?')
                  print(f'=== STEP: {step_name} ({dur}ms) ===')
                  if 'SCORING_AUDIT' in step_name:
                      print(f'  Candidates: {inputs.get(\"candidateCount\", \"?\")}')
                      top = outputs.get('topTwenty', [])
                      print(f'  Top {len(top)} scored tasks:')
                      for t in top:
                          print(f'    [{t.get(\"score\",0):>3}] {t.get(\"title\",\"?\")[:50]:<50} est={t.get(\"estimate_minutes\",\"?\"):>4}min  is_priority={t.get(\"is_priority\",False)}  pushed={t.get(\"pushed_count\",0)}  tier={t.get(\"assignment_tier\",\"-\")}')
                  elif 'PLACEMENT' in step_name:
                      accepted = outputs.get('accepted', [])
                      rejected = outputs.get('rejected', [])
                      kw = outputs.get('keywordOverrides', [])
                      print(f'  Windows: {inputs.get(\"activeWindows\",[])}')
                      print(f'  Window capacities: {inputs.get(\"windowCapacities\",{})}')
                      print(f'  Accepted ({len(accepted)}):')
                      for a in accepted:
                          print(f'    {a.get(\"title\",\"?\")[:50]:<50} window={a.get(\"window\",\"?\")}  dur={a.get(\"duration\",\"?\")}min  score={a.get(\"score\",\"?\")}  tier={a.get(\"tier\",\"-\")}')
                      if rejected:
                          print(f'  Rejected ({len(rejected)}):')
                          for r in rejected:
                              print(f'    {r.get(\"title\",\"?\")[:50]:<50} reason={r.get(\"reason\",\"?\")}')
                      if kw:
                          print(f'  Keyword overrides ({len(kw)}):')
                          for k in kw:
                              print(f'    {k.get(\"title\",\"?\")[:40]} matched={k.get(\"matchedKeyword\",\"?\")} override_window={k.get(\"overrideWindow\",\"?\")}')
                  elif 'RESCHEDULE_RETRY' in step_name:
                      print(f'  AI rejected: {inputs.get(\"aiRejectedCount\",\"?\")}  retry eligible: {inputs.get(\"retryEligibleCount\",\"?\")}')
                      print(f'  Committed: {outputs.get(\"committed\",\"?\")}')
                      deferred = outputs.get('deferred', [])
                      if deferred:
                          print(f'  Deferred ({len(deferred)}):')
                          for d in deferred:
                              print(f'    {d.get(\"title\",\"?\")[:50]:<50} reason={d.get(\"reason\",\"?\")}')
                  print()
          " || echo "Python parse error"

          # Summary to step summary
          echo "## Schedule Debug: $TARGET_DATE" >> $GITHUB_STEP_SUMMARY
          echo "Run workflow with a specific \`target_date\` to analyze that day's scheduling run." >> $GITHUB_STEP_SUMMARY
          echo "Check the job log above for full SCORING_AUDIT and PLACEMENT details." >> $GITHUB_STEP_SUMMARY

      - name: Show scheduled_calls commsMode for all users
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== user_scheduling_prefs.scheduled_calls (commsMode per call) ==="
          PREFS=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Accept: application/json" \
            --data-urlencode "select=user_id,timezone,scheduled_calls" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/user_scheduling_prefs")
          HTTP=$(echo "$PREFS" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY=$(echo "$PREFS" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP"
          echo "$BODY" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          for row in rows:
              print('user:', row.get('user_id','?')[:8], '  tz:', row.get('timezone','?'))
              for c in (row.get('scheduled_calls') or []):
                  status = 'ON ' if c.get('enabled', False) else 'OFF'
                  print('  [' + status + ']', c.get('id','?').ljust(20), 'commsMode=' + str(c.get('commsMode','?')).ljust(12), 'time=' + str(c.get('time','?')))
          " || echo "parse error"

          echo ""
          echo "=== pending scheduled_notifications (scheduled_call, not yet delivered) ==="
          NOTIFS=$(curl -G -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Accept: application/json" \
            --data-urlencode "select=id,notification_type,body,scheduled_for,delivered_at" \
            --data-urlencode "notification_type=eq.scheduled_call" \
            --data-urlencode "delivered_at=is.null" \
            --data-urlencode "order=scheduled_for.asc" \
            --data-urlencode "limit=10" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/scheduled_notifications")
          HTTP2=$(echo "$NOTIFS" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          BODY2=$(echo "$NOTIFS" | sed '/HTTP_STATUS:/d')
          echo "HTTP $HTTP2"
          echo "$BODY2" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          print(len(rows), 'pending row(s)')
          for r in rows:
              body = r.get('body') or {}
              if isinstance(body, str):
                  try: body = json.loads(body)
                  except: pass
              print(' ', r.get('scheduled_for','?')[:16], ' call_id=' + str(body.get('call_id','?')).ljust(20), 'commsMode=' + str(body.get('commsMode','?')))
          " || echo "parse error"
