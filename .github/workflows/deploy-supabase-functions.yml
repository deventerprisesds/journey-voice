name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (leave blank for changed functions, "all" to force-deploy everything)'
        required: false
        default: ''
      supabase_token:
        description: 'Supabase access token (falls back to SUPABASE_ACCESS_TOKEN secret if blank)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Functions

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve token
        id: token
        run: |
          if [ -n "${{ github.event.inputs.supabase_token }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN=${{ github.event.inputs.supabase_token }}" >> "$GITHUB_ENV"
          else
            echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPERBASE_ACCESS_TOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Sync edge function secrets from GitHub
        # GitHub org secrets are the single source of truth. Copy the shared
        # huddle↔journey proxy token into Supabase so it never has to be set by
        # hand and can't drift from Huddle's copy (both read the same org secret).
        # huddle-task-sync reuses this same JOURNEY_PROXY_TOKEN as its webhook auth,
        # so no new org secret is introduced.
        env:
          JOURNEY_PROXY_TOKEN: ${{ secrets.JOURNEY_PROXY_TOKEN }}
        run: |
          if [ -z "$JOURNEY_PROXY_TOKEN" ]; then
            echo "JOURNEY_PROXY_TOKEN not set as a GitHub secret — skipping sync."
            exit 0
          fi
          supabase secrets set JOURNEY_PROXY_TOKEN="$JOURNEY_PROXY_TOKEN" --project-ref wwxgajrtmslzklnyplah
          echo "Synced JOURNEY_PROXY_TOKEN to Supabase edge secrets"

      - name: Determine functions to deploy
        id: changed
        run: |
          INPUT="${{ github.event.inputs.function_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT" = "all" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT" ]; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "fn=$INPUT" >> "$GITHUB_OUTPUT"

          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ \
              | grep -oP 'supabase/functions/\K[^/]+' \
              | sort -u \
              | grep -v '^_' || true)
            if [ -z "$CHANGED" ]; then
              echo "No deployable function changes detected"
              echo "mode=none" >> "$GITHUB_OUTPUT"
            else
              echo "Changed functions: $CHANGED"
              echo "mode=list" >> "$GITHUB_OUTPUT"
              # Collapse newlines to spaces — GITHUB_OUTPUT rejects multi-line values
              echo "fns=$(echo "$CHANGED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy all functions
        if: steps.changed.outputs.mode == 'all'
        run: |
          # Deploy each function INDIVIDUALLY rather than one bulk `supabase functions deploy`.
          #
          # Why: the bulk call deploys alphabetically and aborts on the first failure, so a single
          # bad function silently skips every function after it. Observed 2026-08-21: `mcp` bundles
          # to 26 MB and the deploy API rejects it with
          #   unexpected update function status 413: {"message":"request entity too large"}
          # which aborted at "m" — nightly-schedule-builder, notification-*, and
          # smart-calendar-scheduler were never deployed, while the log looked like a normal run.
          # That is how a shadow test nearly ran against un-deployed code.
          #
          # This loop keeps going, then prints an explicit per-function summary. It still exits
          # non-zero if anything failed — an oversized function is real signal and must stay visible,
          # not be excluded to make the check green.
          echo "Deploying all functions to wwxgajrtmslzklnyplah (individually)..."
          ok=(); failed=()
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in _*) continue;; esac   # _shared etc. are bundled, not deployed
            if supabase functions deploy "$fn" --project-ref wwxgajrtmslzklnyplah; then
              echo "✅ $fn"
              ok+=("$fn")
            else
              echo "❌ $fn FAILED (continuing)"
              failed+=("$fn")
            fi
          done
          echo ""
          echo "──────── deploy summary ────────"
          echo "deployed (${#ok[@]}): ${ok[*]}"
          echo "failed   (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} function(s) failed to deploy: ${failed[*]}"
            exit 1
          fi

      - name: Deploy single function
        if: steps.changed.outputs.mode == 'single'
        run: |
          FN="${{ steps.changed.outputs.fn }}"
          echo "Deploying $FN to wwxgajrtmslzklnyplah..."
          supabase functions deploy "$FN" --project-ref wwxgajrtmslzklnyplah
          echo "✅ $FN deployed"

      - name: Deploy changed functions
        if: steps.changed.outputs.mode == 'list'
        run: |
          # Same continue-then-summarise pattern as the "all" path: without it, one failing
          # function silently skips the remaining changed ones and the log still looks fine.
          ok=(); failed=()
          for fn in ${{ steps.changed.outputs.fns }}; do
            echo "Deploying $fn..."
            if supabase functions deploy "$fn" --project-ref wwxgajrtmslzklnyplah; then
              echo "✅ $fn deployed"
              ok+=("$fn")
            else
              echo "❌ $fn FAILED (continuing)"
              failed+=("$fn")
            fi
          done
          echo ""
          echo "──────── deploy summary ────────"
          echo "deployed (${#ok[@]}): ${ok[*]:-none}"
          echo "failed   (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} function(s) failed to deploy: ${failed[*]}"
            exit 1
          fi
