name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (leave blank for changed functions, "all" to force-deploy everything)'
        required: false
        default: ''
      supabase_token:
        description: 'Supabase access token (falls back to SUPABASE_ACCESS_TOKEN secret if blank)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Functions

    steps:
      - uses: actions/checkout@v4
        with:
          # 0, not 2. `merge-base --is-ancestor` answers from a shallow clone's TRUNCATED
          # history without erroring, so the staleness guard below needs the real graph.
          # The "Determine functions to deploy" step's `git diff HEAD~1 HEAD` still works.
          fetch-depth: 0

      - name: Refuse a ref that does not contain the base branch
        # A deploy OVERWRITES the live function with whatever this ref holds, so deploying a
        # branch that is behind `main` REVERTS every fix that landed on main since it forked.
        # That is not hypothetical: on 2026-09-03 execute-tool was deployed from a branch
        # missing 2fb90ac and re-broke explicit-time reschedules in production for ~2.5 hours.
        # The prose rule already existed in two CLAUDE.md files and was still broken, so the
        # check is mechanical now. Runs BEFORE the secret syncs so a refused deploy touches
        # nothing at all.
        run: |
          git fetch --no-tags origin main
          bash scripts/assert-ref-contains-main.sh origin/main HEAD

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve token
        id: token
        run: |
          if [ -n "${{ github.event.inputs.supabase_token }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN=${{ github.event.inputs.supabase_token }}" >> "$GITHUB_ENV"
          else
            echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPERBASE_ACCESS_TOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Sync edge function secrets from GitHub
        # GitHub org secrets are the single source of truth. Copy the shared
        # huddle↔journey proxy token into Supabase so it never has to be set by
        # hand and can't drift from Huddle's copy (both read the same org secret).
        # huddle-task-sync reuses this same JOURNEY_PROXY_TOKEN as its webhook auth,
        # so no new org secret is introduced.
        env:
          JOURNEY_PROXY_TOKEN: ${{ secrets.JOURNEY_PROXY_TOKEN }}
        run: |
          if [ -z "$JOURNEY_PROXY_TOKEN" ]; then
            echo "JOURNEY_PROXY_TOKEN not set as a GitHub secret — skipping sync."
            exit 0
          fi
          supabase secrets set JOURNEY_PROXY_TOKEN="$JOURNEY_PROXY_TOKEN" --project-ref wwxgajrtmslzklnyplah
          echo "Synced JOURNEY_PROXY_TOKEN to Supabase edge secrets"

      - name: Sync UAT_BYPASS_TOKEN to Supabase edge secrets
        # The sheet syncs write assignments into NEXUS (Azure), and nexus-hub's
        # requireWrite needs a VERIFIED owner. A service-role edge function has no user
        # session, so the UAT bypass is the only machine-to-machine path nexus-hub
        # accepts. Reuses the EXISTING org secret (UAT_TOKEN) rather than minting a new
        # one. Absent -> the syncs refuse to write and say so, rather than silently
        # reporting success while writing nothing.
        env:
          UAT_BYPASS_TOKEN: ${{ secrets.UAT_TOKEN }}
        run: |
          if [ -z "$UAT_BYPASS_TOKEN" ]; then
            echo "UAT_TOKEN not set as a GitHub secret — skipping sync (Nexus writes will be disabled)."
            exit 0
          fi
          supabase secrets set UAT_BYPASS_TOKEN="$UAT_BYPASS_TOKEN" --project-ref wwxgajrtmslzklnyplah
          echo "Synced UAT_BYPASS_TOKEN to Supabase edge secrets"

      - name: Point UNIFIED_WEBHOOK_URL at journey's own /notify endpoint
        # THE CUTOVER, and it is one value. `send-unified-notification` reads
        # UNIFIED_WEBHOOK_URL and POSTs the notification there. It pointed at an n8n webhook
        # whose only live delivery path was an LLM electing to call a tool — measured
        # 2026-09-08, four sends, zero mail, and n8n answers {"message":"Workflow was started"}
        # either way, so journey logged success for mail that never left.
        #
        # NOT a new secret: this is a URL, and journey already owns the endpoint. The Worker
        # authenticates the caller with JOURNEY_PROXY_TOKEN, synced above, so no credential is
        # introduced here.
        #
        # OVERRIDABLE: set a repo/org variable NOTIFY_ENDPOINT_URL to send somewhere else
        # (back to n8n, or to the Azure Function App once /notify moves there — the owner's
        # stated direction is to EXTEND job-platform-api, not stand up a new app). Rolling back
        # is therefore a variable change plus a re-run, not a code change.
        env:
          NOTIFY_URL: ${{ vars.NOTIFY_ENDPOINT_URL }}
        run: |
          URL="${NOTIFY_URL:-https://twilio-openai-bridge.purple-bush-495e.workers.dev/notify}"
          # Verified live 2026-09-13 from the DB's network path (the CCR sandbox's egress denies
          # workers.dev): /health -> 200 {"status":"ok","version":"2026-03-11-cf-v9"}, and
          # /notify -> 401 with no secret and with a wrong one. Route deployed, auth wired.
          supabase secrets set UNIFIED_WEBHOOK_URL="$URL" --project-ref wwxgajrtmslzklnyplah
          echo "UNIFIED_WEBHOOK_URL -> $URL"

      - name: Determine functions to deploy
        id: changed
        run: |
          INPUT="${{ github.event.inputs.function_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT" = "all" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT" ]; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "fn=$INPUT" >> "$GITHUB_OUTPUT"

          else
            # THE RANGE MUST MATCH THE PUSH, NOT THE LAST COMMIT.
            # The `paths:` trigger above fires when ANY commit in the push touches
            # supabase/functions/**, but this diff used to read HEAD~1..HEAD -- one commit. A push
            # whose LAST commit happens to touch something else (a docs tweak, a .gitignore fix, a
            # merge commit) therefore deployed NOTHING while reporting success.
            # Measured 2026-09-13: a merge to main carrying a brand-new `send-digests` function and
            # a fix to `notification-delivery` went green and deployed neither, because the final
            # commit in the push was `chore: untrack tsc build cache`. Confirmed by listing the
            # project's live functions afterwards -- `send-digests` was absent.
            # github.event.before is the ref main pointed at BEFORE this push, so this covers every
            # commit the trigger considered. It is all-zeros for a branch's first push, and
            # unreachable if the range was force-pushed away; both fall back to deploying
            # everything, because under-deploying silently is the failure being fixed.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "Push range unavailable (first push, or history rewritten) -- deploying all"
              echo "mode=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TOUCHED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- supabase/functions/ \
              | grep -oP 'supabase/functions/\K[^/]+' \
              | sort -u || true)

            # A _shared/ change has NO function directory of its own, and the filter below strips
            # it -- so a pure _shared edit used to deploy nothing while changing code that EVERY
            # consumer bundles at deploy time. Supabase bundles shared modules into each function,
            # so an undeployed consumer keeps running the old copy indefinitely. Deploy everything
            # rather than try to resolve the import graph in bash.
            if printf '%s\n' "$TOUCHED" | grep -q '^_'; then
              echo "_shared changed -- every consumer bundles it, so deploying all"
              echo "mode=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            CHANGED=$(printf '%s\n' "$TOUCHED" | grep -v '^_' || true)
            if [ -z "$CHANGED" ]; then
              echo "No deployable function changes detected"
              echo "mode=none" >> "$GITHUB_OUTPUT"
            else
              echo "Changed functions: $CHANGED"
              echo "mode=list" >> "$GITHUB_OUTPUT"
              # Collapse newlines to spaces — GITHUB_OUTPUT rejects multi-line values
              echo "fns=$(echo "$CHANGED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy all functions
        if: steps.changed.outputs.mode == 'all'
        run: |
          # Deploy each function INDIVIDUALLY rather than one bulk `supabase functions deploy`.
          #
          # Why: the bulk call deploys alphabetically and aborts on the first failure, so a single
          # bad function silently skips every function after it. Observed 2026-08-21: `mcp` bundles
          # to 26 MB and the deploy API rejects it with
          #   unexpected update function status 413: {"message":"request entity too large"}
          # which aborted at "m" — nightly-schedule-builder, notification-*, and
          # smart-calendar-scheduler were never deployed, while the log looked like a normal run.
          # That is how a shadow test nearly ran against un-deployed code.
          #
          # This loop keeps going, then prints an explicit per-function summary. It still exits
          # non-zero if anything failed — an oversized function is real signal and must stay visible,
          # not be excluded to make the check green.
          echo "Deploying all functions to wwxgajrtmslzklnyplah (individually)..."
          ok=(); failed=()
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in _*) continue;; esac   # _shared etc. are bundled, not deployed
            if supabase functions deploy "$fn" --project-ref wwxgajrtmslzklnyplah; then
              echo "✅ $fn"
              ok+=("$fn")
            else
              echo "❌ $fn FAILED (continuing)"
              failed+=("$fn")
            fi
          done
          echo ""
          echo "──────── deploy summary ────────"
          echo "deployed (${#ok[@]}): ${ok[*]}"
          echo "failed   (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} function(s) failed to deploy: ${failed[*]}"
            exit 1
          fi

      - name: Deploy single function
        if: steps.changed.outputs.mode == 'single'
        run: |
          FN="${{ steps.changed.outputs.fn }}"
          echo "Deploying $FN to wwxgajrtmslzklnyplah..."
          supabase functions deploy "$FN" --project-ref wwxgajrtmslzklnyplah
          echo "✅ $FN deployed"

      - name: Deploy changed functions
        if: steps.changed.outputs.mode == 'list'
        run: |
          # Same continue-then-summarise pattern as the "all" path: without it, one failing
          # function silently skips the remaining changed ones and the log still looks fine.
          ok=(); failed=()
          for fn in ${{ steps.changed.outputs.fns }}; do
            echo "Deploying $fn..."
            if supabase functions deploy "$fn" --project-ref wwxgajrtmslzklnyplah; then
              echo "✅ $fn deployed"
              ok+=("$fn")
            else
              echo "❌ $fn FAILED (continuing)"
              failed+=("$fn")
            fi
          done
          echo ""
          echo "──────── deploy summary ────────"
          echo "deployed (${#ok[@]}): ${ok[*]:-none}"
          echo "failed   (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} function(s) failed to deploy: ${failed[*]}"
            exit 1
          fi
