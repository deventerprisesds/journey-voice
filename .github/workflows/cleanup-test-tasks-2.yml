name: Cleanup Test Tasks (2)

on:
  workflow_dispatch:
    inputs:
      ids_csv:
        description: 'Comma-separated task UUIDs to delete'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Batch delete by id (retry per id, since a large filter-delete 500s on the sync trigger)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
          IDS_CSV: ${{ github.event.inputs.ids_csv }}
        run: |
          set -e
          IFS=',' read -ra IDS <<< "$IDS_CSV"
          for id in "${IDS[@]}"; do
            id_trimmed=$(echo "$id" | xargs)
            [ -z "$id_trimmed" ] && continue
            echo "Deleting $id_trimmed ..."
            for attempt in 1 2 3; do
              RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X DELETE \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
                "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?id=eq.$id_trimmed")
              HTTP=$(echo "$RESP" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
              if [ "$HTTP" = "204" ] || [ "$HTTP" = "200" ]; then
                echo "  ok ($HTTP)"
                break
              else
                echo "  attempt $attempt failed (HTTP $HTTP), retrying..."
                sleep 2
              fi
            done
          done
          echo "Done."
