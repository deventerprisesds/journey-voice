name: Test Schedule Widget Query

on:
  workflow_dispatch:
    inputs:
      timezone_offset_hours:
        description: 'Device timezone UTC offset in hours (e.g. -4 for EDT, -7 for PDT). Default: -4'
        required: false
        default: '-4'

jobs:
  test-query:
    runs-on: ubuntu-latest
    steps:
      - name: Compute today UTC window
        id: window
        run: |
          OFFSET="${{ github.event.inputs.timezone_offset_hours }}"
          OFFSET=${OFFSET:--4}
          python3 - <<EOF
import datetime, os
offset = float("$OFFSET")
now = datetime.datetime.utcnow()
todayLocal = (now + datetime.timedelta(hours=offset)).date()
todayStartUTC = datetime.datetime.combine(todayLocal, datetime.time.min) - datetime.timedelta(hours=offset)
tomorrowStartUTC = todayStartUTC + datetime.timedelta(days=1)
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write(f"today_start={todayStartUTC.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
    f.write(f"tomorrow_start={tomorrowStartUTC.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
    f.write(f"today_local={todayLocal}\n")
print(f"Today local: {todayLocal} | UTC offset: {offset}h")
print(f"UTC window: {todayStartUTC.isoformat()}Z .. {tomorrowStartUTC.isoformat()}Z")
EOF

      - name: Find user_id for tiggapoohtv@yahoo.com
        id: user
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          USERS=$(curl -sf \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY" \
            "https://wwxgajrtmslzklnyplah.supabase.co/auth/v1/admin/users?per_page=50")
          USER_ID=$(echo "$USERS" | python3 -c "
import json, sys
data = json.load(sys.stdin)
users = data.get('users', data) if isinstance(data, dict) else data
for u in users:
    if u.get('email','').lower() == 'tiggapoohtv@yahoo.com':
        print(u['id'])
        break
")
          if [ -z "$USER_ID" ]; then
            echo "Could not find user — will query without user filter"
            USER_ID=""
          else
            echo "Found user_id: ${USER_ID:0:8}..."
          fi
          echo "user_id=$USER_ID" >> $GITHUB_OUTPUT

      - name: Query 1 - Schema check (3 rows with start_time, any user)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          echo "## Query 1: Schema check" >> $GITHUB_STEP_SUMMARY
          echo "Shows 3 tasks with start_time populated to confirm column format" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time,due_date&start_time=not.is.null&order=start_time.desc&limit=3" \
            | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "(failed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Query 2 - start_time window for this user today
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          TODAY_LOCAL="${{ steps.window.outputs.today_local }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          USER_FILTER=""
          [ -n "$USER_ID" ] && USER_FILTER="&user_id=eq.${USER_ID}"
          echo "## Query 2: start_time in today's UTC window" >> $GITHUB_STEP_SUMMARY
          echo "Today: $TODAY_LOCAL | Window: $TODAY_START .. $TOMORROW_START" >> $GITHUB_STEP_SUMMARY
          echo "*(These are the tasks FocusView shows in Today's Schedule)*" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time${USER_FILTER}&start_time=gte.${TODAY_START}&start_time=lt.${TOMORROW_START}&order=start_time.asc&limit=30" \
            | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "(failed or empty)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Query 3 - Full widget query (DOING OR start_time today)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          TODAY_LOCAL="${{ steps.window.outputs.today_local }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          USER_FILTER=""
          [ -n "$USER_ID" ] && USER_FILTER="&user_id=eq.${USER_ID}"
          echo "## Query 3: Full widget query" >> $GITHUB_STEP_SUMMARY
          echo "Android ScheduleWidget filter: status=DOING OR start_time in today's window" >> $GITHUB_STEP_SUMMARY
          echo "Today: $TODAY_LOCAL | Window: $TODAY_START .. $TOMORROW_START" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time${USER_FILTER}&or=(status.eq.DOING,and(start_time.gte.${TODAY_START},start_time.lt.${TOMORROW_START}))&order=start_time.asc.nullslast&limit=30" \
            | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "(failed or empty)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "## Match check" >> $GITHUB_STEP_SUMMARY
          echo "Compare Query 2 above with what you see in the app's Focus tab > Today's Schedule." >> $GITHUB_STEP_SUMMARY
          echo "If they match, the widget query is confirmed correct." >> $GITHUB_STEP_SUMMARY
          echo "If Query 2 is empty but the app shows tasks, start_time may be in local time — check Query 1 format." >> $GITHUB_STEP_SUMMARY
