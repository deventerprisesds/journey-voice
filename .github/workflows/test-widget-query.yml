name: Test Schedule Widget Query

on:
  workflow_dispatch:
    inputs:
      timezone_offset_hours:
        description: 'Device timezone UTC offset in hours (e.g. -4 for EDT, -7 for PDT)'
        required: false
        default: '-4'

jobs:
  test-query:
    runs-on: ubuntu-latest
    steps:
      - name: Compute today UTC window
        id: window
        run: |
          OFFSET="${{ github.event.inputs.timezone_offset_hours }}"
          OFFSET=${OFFSET:--4}
          RESULT=$(python3 -c "import datetime; offset=float('$OFFSET'); now=datetime.datetime.utcnow(); local=(now+datetime.timedelta(hours=offset)).date(); start=datetime.datetime.combine(local,datetime.time.min)-datetime.timedelta(hours=offset); end=start+datetime.timedelta(days=1); print(f'{local},{start.strftime(\"%Y-%m-%dT%H:%M:%SZ\")},{end.strftime(\"%Y-%m-%dT%H:%M:%SZ\")}')")
          TODAY_LOCAL=$(echo "$RESULT" | cut -d, -f1)
          TODAY_START=$(echo "$RESULT" | cut -d, -f2)
          TOMORROW_START=$(echo "$RESULT" | cut -d, -f3)
          echo "today_start=$TODAY_START" >> $GITHUB_OUTPUT
          echo "tomorrow_start=$TOMORROW_START" >> $GITHUB_OUTPUT
          echo "today_local=$TODAY_LOCAL" >> $GITHUB_OUTPUT
          echo "Today local: $TODAY_LOCAL | UTC offset: ${OFFSET}h"
          echo "UTC window: $TODAY_START .. $TOMORROW_START"

      - name: Find user_id for tiggapoohtv@yahoo.com
        id: user
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          RAW=$(curl -s \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY" \
            "https://wwxgajrtmslzklnyplah.supabase.co/auth/v1/admin/users?per_page=50")
          echo "Auth admin response: $(echo $RAW | python3 -c 'import json,sys; d=json.load(sys.stdin); print(type(d).__name__, list(d.keys()) if isinstance(d,dict) else len(d))')" || echo "Not JSON: $RAW"
          USER_ID=$(echo "$RAW" | python3 -c "import json,sys; data=json.load(sys.stdin); users=data.get('users',data) if isinstance(data,dict) else data; matches=[u['id'] for u in users if u.get('email','').lower()=='tiggapoohtv@yahoo.com']; print(matches[0] if matches else '')")
          if [ -z "$USER_ID" ]; then
            echo "user not found via email — querying without user filter"
          else
            echo "Found user_id: ${USER_ID:0:8}..."
          fi
          echo "user_id=$USER_ID" >> $GITHUB_OUTPUT

      - name: EXACT widget query - getTodayTasks() from SupabaseTaskClient
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          TODAY_LOCAL="${{ steps.window.outputs.today_local }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          echo "=== EXACT WIDGET QUERY: getTodayTasks() ==="
          echo "Today: $TODAY_LOCAL | Window: $TODAY_START .. $TOMORROW_START"
          ARGS=(
            -G -s -w "\nHTTP_STATUS:%{http_code}"
            -H "apikey: $SB_KEY"
            -H "Authorization: Bearer $SB_KEY"
            -H "Accept: application/json"
            --data-urlencode "select=id,title,status,priority,start_time,due_date,estimate_minutes"
            --data-urlencode "or=(status.eq.DOING,and(start_time.gte.${TODAY_START},start_time.lt.${TOMORROW_START}))"
            --data-urlencode "order=start_time.asc.nullslast"
            --data-urlencode "limit=30"
          )
          if [ -n "$USER_ID" ]; then
            ARGS+=(--data-urlencode "user_id=eq.${USER_ID}")
          fi
          FULL=$(curl "${ARGS[@]}" "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks")
          HTTP_CODE=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          RESULT=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_CODE"
          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(len(arr))" 2>/dev/null || echo "?")
          echo "=== $COUNT task(s) returned ==="
          echo "$RESULT" | python3 -c "
          import json, sys
          tasks = json.load(sys.stdin)
          for t in tasks:
              start = (t.get('start_time') or 'no-time')[:16]
              est = t.get('estimate_minutes')
              est_str = f'{est}min' if est else 'no estimate'
              print(f'  [{start}] {t.get(\"title\",\"?\")[:55]:<55} est={est_str}  status={t.get(\"status\",\"?\")}')
          " || echo "Could not parse"
          echo "## Exact widget query: getTodayTasks()" >> $GITHUB_STEP_SUMMARY
          echo "Today: $TODAY_LOCAL | HTTP: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "$RESULT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          [ "$HTTP_CODE" = "200" ] || exit 1

      - name: FocusView equivalent - start_time window only
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          echo "=== FOCUSVIEW EQUIVALENT: start_time window only ==="
          ARGS=(
            -G -s -w "\nHTTP_STATUS:%{http_code}"
            -H "apikey: $SB_KEY"
            -H "Authorization: Bearer $SB_KEY"
            -H "Accept: application/json"
            --data-urlencode "select=id,title,status,start_time"
            --data-urlencode "start_time=gte.${TODAY_START}"
            --data-urlencode "start_time=lt.${TOMORROW_START}"
            --data-urlencode "order=start_time.asc"
            --data-urlencode "limit=30"
          )
          if [ -n "$USER_ID" ]; then
            ARGS+=(--data-urlencode "user_id=eq.${USER_ID}")
          fi
          FULL=$(curl "${ARGS[@]}" "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks")
          HTTP_CODE=$(echo "$FULL" | grep 'HTTP_STATUS:' | tail -1 | cut -d: -f2)
          RESULT=$(echo "$FULL" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_CODE"
          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; arr=json.load(sys.stdin); print(len(arr))" 2>/dev/null || echo "?")
          echo "=== $COUNT task(s) returned ==="
          echo "## FocusView equivalent: start_time window only" >> $GITHUB_STEP_SUMMARY
          echo "HTTP: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "$RESULT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
