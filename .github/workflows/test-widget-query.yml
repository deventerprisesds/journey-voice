name: Test Schedule Widget Query

on:
  workflow_dispatch:
    inputs:
      timezone_offset_hours:
        description: 'Device timezone UTC offset in hours (e.g. -4 for EDT, -7 for PDT)'
        required: false
        default: '-4'

jobs:
  test-query:
    runs-on: ubuntu-latest
    steps:
      - name: Compute today UTC window
        id: window
        run: |
          OFFSET="${{ github.event.inputs.timezone_offset_hours }}"
          OFFSET=${OFFSET:--4}
          RESULT=$(python3 -c "import datetime; offset=float('$OFFSET'); now=datetime.datetime.utcnow(); local=(now+datetime.timedelta(hours=offset)).date(); start=datetime.datetime.combine(local,datetime.time.min)-datetime.timedelta(hours=offset); end=start+datetime.timedelta(days=1); print(f'{local},{start.strftime(\"%Y-%m-%dT%H:%M:%SZ\")},{end.strftime(\"%Y-%m-%dT%H:%M:%SZ\")}'  )")
          TODAY_LOCAL=$(echo "$RESULT" | cut -d, -f1)
          TODAY_START=$(echo "$RESULT" | cut -d, -f2)
          TOMORROW_START=$(echo "$RESULT" | cut -d, -f3)
          echo "today_start=$TODAY_START" >> $GITHUB_OUTPUT
          echo "tomorrow_start=$TOMORROW_START" >> $GITHUB_OUTPUT
          echo "today_local=$TODAY_LOCAL" >> $GITHUB_OUTPUT
          echo "Today local: $TODAY_LOCAL | UTC offset: ${OFFSET}h"
          echo "UTC window: $TODAY_START .. $TOMORROW_START"

      - name: Find user_id for tiggapoohtv@yahoo.com
        id: user
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          RAW=$(curl -sf \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY" \
            "https://wwxgajrtmslzklnyplah.supabase.co/auth/v1/admin/users?per_page=50")
          echo "Auth admin response type: $(echo $RAW | python3 -c 'import json,sys; d=json.load(sys.stdin); print(type(d).__name__, list(d.keys()) if isinstance(d,dict) else len(d))')" || echo "Response was not JSON: $RAW"
          USER_ID=$(echo "$RAW" | python3 -c "import json,sys; data=json.load(sys.stdin); users=data.get('users',data) if isinstance(data,dict) else data; matches=[u['id'] for u in users if u.get('email','').lower()=='tiggapoohtv@yahoo.com']; print(matches[0] if matches else '')")
          if [ -z "$USER_ID" ]; then
            echo "Could not find user - querying without user filter"
          else
            echo "Found user_id: ${USER_ID:0:8}..."
          fi
          echo "user_id=$USER_ID" >> $GITHUB_OUTPUT

      - name: Query 1 - Schema check (3 rows with start_time)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== QUERY 1: Schema check (3 tasks with start_time) ==="
          RESULT=$(curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time,due_date&start_time=not.is.null&order=start_time.desc&limit=3")
          echo "$RESULT" | python3 -m json.tool || echo "RAW: $RESULT"
          echo "## Query 1: Schema check (3 tasks with start_time)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "$RESULT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Query 2 - start_time window for this user today
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          USER_FILTER=""
          [ -n "$USER_ID" ] && USER_FILTER="&user_id=eq.${USER_ID}"
          echo "=== QUERY 2: start_time window $TODAY_START .. $TOMORROW_START (user_filter: ${USER_FILTER:-none}) ==="
          RESULT=$(curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time${USER_FILTER}&start_time=gte.${TODAY_START}&start_time=lt.${TOMORROW_START}&order=start_time.asc&limit=30")
          echo "$RESULT" | python3 -m json.tool || echo "RAW: $RESULT"
          echo "## Query 2: start_time in today UTC window" >> $GITHUB_STEP_SUMMARY
          echo "Window: $TODAY_START .. $TOMORROW_START" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "$RESULT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Query 3 - Full widget query (DOING/UP_NEXT/READY/TODO OR start_time today)
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          TODAY_START="${{ steps.window.outputs.today_start }}"
          TOMORROW_START="${{ steps.window.outputs.tomorrow_start }}"
          USER_ID="${{ steps.user.outputs.user_id }}"
          USER_FILTER=""
          [ -n "$USER_ID" ] && USER_FILTER="&user_id=eq.${USER_ID}"
          echo "=== QUERY 3: Full widget query (user_filter: ${USER_FILTER:-none}) ==="
          RESULT=$(curl -sf \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Accept: application/json" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/tasks?select=id,title,status,start_time${USER_FILTER}&or=(status.eq.DOING,status.eq.UP_NEXT,status.eq.READY,status.eq.TODO,and(start_time.gte.${TODAY_START},start_time.lt.${TOMORROW_START}))&order=start_time.asc.nullslast&limit=30")
          echo "$RESULT" | python3 -m json.tool || echo "RAW: $RESULT"
          echo "## Query 3: Full widget query" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "$RESULT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
