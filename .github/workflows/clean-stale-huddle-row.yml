name: Clean Stale Huddle Push Row (one-shot)

# Deletes the standalone Huddle app's OLD app-less push_subscriptions row (endpoint `fcm:<token>`),
# now superseded by its namespaced `fcm:app:huddle:<token>` row after re-registration. Targeted by
# exact endpoint so journey's own bridge (`fcm:<userId>`) and web rows are untouched. Dispatch-only.
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Exact endpoint to delete"
        required: true
        default: "fcm:cmmabohkSyi8PeAK5TipDb:APA91bEtS"

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      SB: "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/push_subscriptions"
      SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
      EP: ${{ github.event.inputs.endpoint }}
    steps:
      - name: Delete by exact endpoint
        run: |
          set -euo pipefail
          ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['EP'],safe=''))")
          echo "Deleting endpoint: $EP"
          RESP=$(curl -sS -X DELETE \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -H "Prefer: return=representation" -H "Accept: application/json" \
            "$SB?endpoint=eq.$ENC")
          echo "Deleted rows: $RESP"
          echo "$RESP" | python3 -c "import sys,json;r=json.load(sys.stdin);print('OK - removed',len(r),'row(s)')"
