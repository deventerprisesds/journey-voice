name: Query Push Tokens (one-shot)

# Shows the user's registered FCM device tokens (prefix + timestamps + platform) to confirm whether
# the FCM Multi-App test app registered its OWN distinct token — i.e. a different-package app got a
# working FCM registration on the shared Firebase project. Read-only; remove after use.
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: List recent push_subscriptions
        env:
          SB_KEY: ${{ secrets.CF_SUPABASE_SERVICE_KEY }}
        run: |
          curl -G -sS \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Accept: application/json" \
            --data-urlencode "select=id,user_id,platform,created_at,updated_at,fcm_token" \
            --data-urlencode "order=updated_at.desc" \
            --data-urlencode "limit=20" \
            "https://wwxgajrtmslzklnyplah.supabase.co/rest/v1/push_subscriptions" \
          | python3 -c "
          import json,sys
          rows=json.load(sys.stdin)
          if not isinstance(rows,list): print('unexpected:',rows); sys.exit(0)
          print(f'{len(rows)} push_subscription row(s):')
          for r in rows:
              tok=(r.get('fcm_token') or '')
              print(f\"  plat={r.get('platform','?'):8} created={str(r.get('created_at'))[:19]} updated={str(r.get('updated_at'))[:19]} token={tok[:18]}…{tok[-6:] if len(tok)>24 else ''}\")
          "
