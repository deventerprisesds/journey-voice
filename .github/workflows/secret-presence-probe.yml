# WHAT: throwaway probe -- reports which secrets this repo's Actions can READ (presence only, never values),
#       whether the APK blob container answers without a SAS, and what the repo's Azure principal can see.
# WHY:  the Download-tab endpoint needs a shared secret on both sides; the GitHub secrets API is blocked from CCR.
# SUPERSEDES: nothing. SUPERSEDED-BY: nothing -- delete the branch after reading the log.
# EVIDENCE: session 2026-11-10 Download-tab fact finding.
name: secret-presence-probe
on:
  push:
    branches: [claude_secret-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: presence
        env:
          S1: ${{ secrets.JOURNEY_PROXY_TOKEN }}
          S2: ${{ secrets.AZURE_KEY_ENCRYPTION_SECRET }}
          S3: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          S4: ${{ secrets.BRIDGE_BUILDER_API_URL }}
          S5: ${{ secrets.AZURE_CLIENT_ID }}
          S6: ${{ secrets.AZURE_CLIENT_SECRET }}
          S7: ${{ secrets.AZURE_TENANT_ID }}
          S8: ${{ secrets.AZURE_CREDENTIALS }}
          S9: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}
          S10: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for n in "JOURNEY_PROXY_TOKEN:$S1" "AZURE_KEY_ENCRYPTION_SECRET:$S2" "AZURE_STORAGE_CONNECTION_STRING:$S3" "BRIDGE_BUILDER_API_URL:$S4" "AZURE_CLIENT_ID:$S5" "AZURE_CLIENT_SECRET:$S6" "AZURE_TENANT_ID:$S7" "AZURE_CREDENTIALS:$S8" "AZURE_FUNCTIONS_PUBLISH_PROFILE:$S9" "AZURE_SUBSCRIPTION_ID:$S10"; do
            k=${n%%:*}; v=${n#*:}; [ -n "$v" ] && echo "PRESENT $k" || echo "absent  $k"; done
          echo "bridge api host: $(echo "$S4" | sed -E 's#https?://([^/]+).*#\1#')"
      - name: blob public?
        run: |
          curl -s -o /dev/null -w "taskos-no-sas=%{http_code}\n" -I https://n8nstxpdthydai6fkm.blob.core.windows.net/bridge-apks/54beaa01-7564-417f-a6cc-bd9190c14dcb/taskos-v1.0.18.apk
      - name: azure principal reach
        env:
          C: ${{ secrets.AZURE_CLIENT_ID }}
          S: ${{ secrets.AZURE_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_TENANT_ID }}
          CR: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$C" ] && [ -n "$CR" ]; then C=$(echo "$CR"|jq -r .clientId); S=$(echo "$CR"|jq -r .clientSecret); T=$(echo "$CR"|jq -r .tenantId); fi
          [ -z "$C" ] && { echo "no SP"; exit 0; }
          az login --service-principal -u "$C" -p "$S" --tenant "$T" --allow-no-subscriptions -o none 2>&1 | tail -2 || true
          az account list --query "[].name" -o tsv || true
          az functionapp list --query "[].{n:name,rg:resourceGroup}" -o tsv 2>&1 | head -20 || true
