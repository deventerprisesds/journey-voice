name = "twilio-openai-bridge"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[durable_objects]
bindings = [
  { name = "CALL_SESSIONS", class_name = "TwilioCallSession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TwilioCallSession"]

[vars]
SUPABASE_URL = "https://wwxgajrtmslzklnyplah.supabase.co"
# Where inbound Slack messages are handed to an agent. A plain var, not a secret: it is a public
# hostname, and the request is authenticated by the JOURNEY_PROXY_TOKEN header, not by the URL.
# Confirmed against huddle-extension-app origin/main (32 references across its workflows), not
# recalled.
HUDDLE_BASE_URL = "https://icy-flower-0f415200f.7.azurestaticapps.net"
# Which agent answers a Slack DIRECT MESSAGE. THIS LINE is where it changes -- the code holds no
# default. A lane channel names its agent (`<agentId>___…`); a DM names nothing, and Huddle does not
# route an unnamed turn, it runs one against the WHOLE 15-agent roster. Must be a real id from
# huddle-extension-app `src/features/huddle/data/agents.ts`.
SLACK_DM_AGENT_ID = "iris-chase"
